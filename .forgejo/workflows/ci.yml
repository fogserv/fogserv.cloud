name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
  pull_request:

jobs:
  quality:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run type-check

      - name: Run tests when available
        run: |
          if bun run | grep -qE '^\s*test\s'; then
            bun run test
          else
            echo "No test script defined yet; skipping test step."
          fi
