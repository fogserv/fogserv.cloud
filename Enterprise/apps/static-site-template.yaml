# Static Site GitOps Application Template
# Usage: Copy this file, rename it (e.g., app-shire.yaml), and replace uppercase placeholders.
#
# Replace:
#   <APP_NAME> (e.g., shire-site)
#   <IMAGE> (e.g., nginx:alpine or a custom static site image)
#   <DOMAIN> (e.g., shire.one)

apiVersion: v1
kind: Namespace
metadata:
  name: <APP_NAME>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <APP_NAME>
  namespace: <APP_NAME>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <APP_NAME>
  template:
    metadata:
      labels:
        app: <APP_NAME>
    spec:
      containers:
        - name: web
          image: <IMAGE>
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: <APP_NAME>
  namespace: <APP_NAME>
spec:
  selector:
    app: <APP_NAME>
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <APP_NAME>-ingress
  namespace: <APP_NAME>
spec:
  ingressClassName: caddy
  rules:
    - host: <DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: <APP_NAME>
                port:
                  number: 80
